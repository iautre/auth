<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设备授权确认</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #18212f;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(68, 112, 255, .16), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(36, 194, 151, .13), transparent 30%),
        #f4f6f8;
    }
    main {
      width: min(100%, 440px);
      padding: 36px;
      border: 1px solid rgba(24, 33, 47, .09);
      border-radius: 20px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 24px 70px rgba(37, 47, 68, .12);
    }
    .brand {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
      border-radius: 13px;
      color: #fff;
      font-weight: 750;
      letter-spacing: -.04em;
      background: linear-gradient(135deg, #315efb, #7147e8);
    }
    h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -.02em; }
    p { margin: 0 0 14px; color: #667085; line-height: 1.6; font-size: 14px; }
    .client {
      margin: 20px 0;
      padding: 14px 16px;
      border: 1px solid #d8dee8;
      border-radius: 12px;
      background: #f8fafc;
    }
    .client strong { display: block; font-size: 16px; color: #18212f; word-break: break-all; }
    .client span { display: block; margin-top: 6px; font-size: 12px; color: #667085; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
    .code {
      margin: 22px 0;
      padding: 18px;
      border: 1px dashed #b9c4d6;
      border-radius: 14px;
      text-align: center;
      background: #fbfcfe;
    }
    .code .label { font-size: 12px; color: #98a2b3; margin-bottom: 8px; }
    .code .value {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: .12em;
      color: #18212f;
    }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    button {
      flex: 1;
      height: 48px;
      border-radius: 11px;
      border: 1px solid transparent;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button[value="allow"] { background: linear-gradient(135deg, #315efb, #7147e8); color: #fff; }
    button[value="deny"] { background: #fff; color: #475467; border-color: #d8dee8; }
    .hint { margin: 18px 0 0; font-size: 12px; color: #98a2b3; }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true">A</div>
    <h1>设备授权确认</h1>
    <p>以下应用申请访问你的 Auth 账号：</p>

    <div class="client">
      <strong>{{.ClientName}}</strong>
      <span>{{.Scope}}</span>
    </div>

    <div class="code">
      <div class="label">请核对设备上显示的识别码与此一致</div>
      <div class="value">{{.UserCode}}</div>
    </div>

    <form method="post" action="{{.ActionPath}}">
      <input type="hidden" name="user_code" value="{{.UserCode}}">
      <div class="actions">
        <button type="submit" name="decision" value="deny">拒绝</button>
        <button type="submit" name="decision" value="allow">允许</button>
      </div>
    </form>

    <p class="hint">只在你确实发起了这次授权时允许。确认后设备会立刻获得访问权限。</p>
  </main>
</body>
</html>
