<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>已拒绝</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #18212f;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 15% 15%, rgba(68, 112, 255, .16), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(36, 194, 151, .13), transparent 30%),
        #f4f6f8;
    }
    main {
      width: min(100%, 420px);
      padding: 36px;
      border: 1px solid rgba(24, 33, 47, .09);
      border-radius: 20px;
      background: rgba(255, 255, 255, .92);
      box-shadow: 0 24px 70px rgba(37, 47, 68, .12);
      text-align: center;
    }
    .brand {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      border-radius: 13px;
      color: #fff;
      font-weight: 750;
      background: linear-gradient(135deg, #98a2b3, #667085);
    }
    h1 { margin: 0 0 12px; font-size: 20px; letter-spacing: -.02em; }
    p { margin: 0; color: #667085; line-height: 1.7; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <div class="brand" aria-hidden="true">×</div>
    <h1>已拒绝</h1>
    <p>你已拒绝这次授权，设备不会获得任何访问权限。</p>
  </main>
</body>
</html>
