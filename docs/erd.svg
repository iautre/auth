<svg viewBox="0 0 680 720" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>auth 数据表关系图</title>
<desc>auth 15 张表的实体关系，按用户域、OAuth2 域、联邦登录域、设备授权域分组</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="34" font-family="sans-serif" font-size="15" font-weight="500" fill="#26215C">auth 数据表关系（15 张，均带 auth_ 前缀）</text>

<rect x="40" y="52" width="190" height="182" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="56" y="74" font-family="sans-serif" font-size="13" font-weight="500" fill="#3C3489">用户域</text>

<rect x="56" y="88" width="158" height="56" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="135" y="108" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">auth_user</text>
<text x="135" y="126" font-family="sans-serif" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">用户主表</text>

<rect x="56" y="156" width="158" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="135" y="176" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">otp_credential</text>
<text x="135" y="194" font-family="sans-serif" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">OTP 验证器</text>

<rect x="40" y="250" width="190" height="150" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="56" y="266" width="158" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="135" y="286" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">otp_enrollment</text>
<text x="135" y="304" font-family="sans-serif" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">OTP 绑定中</text>

<rect x="56" y="334" width="158" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="135" y="354" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle" dominant-baseline="central">passkey_credential</text>
<text x="135" y="372" font-family="sans-serif" font-size="12" fill="#3C3489" text-anchor="middle" dominant-baseline="central">通行密钥</text>

<rect x="250" y="52" width="190" height="120" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="266" y="74" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">OAuth2 授权域</text>

<rect x="266" y="88" width="158" height="70" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="345" y="108" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">oauth2_client</text>
<text x="345" y="126" font-family="sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">OAuth2 客户端</text>
<text x="345" y="142" font-family="sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">id 主键</text>

<rect x="250" y="188" width="190" height="212" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="266" y="210" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">授权码 / token 明细</text>

<rect x="266" y="224" width="158" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="345" y="244" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">authorization_code</text>
<text x="345" y="262" font-family="sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">PKCE + resource</text>

<rect x="266" y="286" width="158" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="345" y="306" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">oauth2_token</text>
<text x="345" y="324" font-family="sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">access + audience</text>

<rect x="266" y="348" width="158" height="52" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="345" y="368" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C" text-anchor="middle" dominant-baseline="central">refresh_token</text>
<text x="345" y="386" font-family="sans-serif" font-size="12" fill="#085041" text-anchor="middle" dominant-baseline="central">刷新 + audience</text>

<rect x="460" y="52" width="180" height="150" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="476" y="74" font-family="sans-serif" font-size="13" font-weight="500" fill="#633806">联邦登录域</text>

<rect x="476" y="88" width="148" height="56" rx="8" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="550" y="108" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">identity_provider</text>
<text x="550" y="126" font-family="sans-serif" font-size="12" fill="#633806" text-anchor="middle" dominant-baseline="central">第三方 IdP 配置</text>

<rect x="476" y="156" width="148" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="550" y="176" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">identity</text>
<text x="550" y="194" font-family="sans-serif" font-size="12" fill="#633806" text-anchor="middle" dominant-baseline="central">用户-IdP 绑定</text>

<rect x="460" y="222" width="180" height="178" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<rect x="476" y="238" width="148" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="550" y="258" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">federated_session</text>
<text x="550" y="276" font-family="sans-serif" font-size="12" fill="#633806" text-anchor="middle" dominant-baseline="central">登录会话 state/nonce</text>

<rect x="476" y="306" width="148" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="550" y="326" font-family="sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">passkey_challenge</text>
<text x="550" y="344" font-family="sans-serif" font-size="12" fill="#633806" text-anchor="middle" dominant-baseline="central">WebAuthn 流程</text>

<rect x="40" y="420" width="600" height="130" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="442" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">设备授权 + 验证码（独立域）</text>

<rect x="56" y="456" width="270" height="80" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="191" y="478" font-family="sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">oauth2_device_code</text>
<text x="191" y="498" font-family="sans-serif" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">device_code_hash 主键</text>
<text x="191" y="516" font-family="sans-serif" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">pending→approved→consumed</text>

<rect x="342" y="456" width="282" height="80" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="0.5"/>
<text x="483" y="478" font-family="sans-serif" font-size="13" font-weight="500" fill="#042C53" text-anchor="middle" dominant-baseline="central">verification_code</text>
<text x="483" y="498" font-family="sans-serif" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">短信/邮箱一次性验证码</text>
<text x="483" y="516" font-family="sans-serif" font-size="12" fill="#0C447C" text-anchor="middle" dominant-baseline="central">code_hash 存储</text>

<rect x="40" y="570" width="600" height="110" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="56" y="592" font-family="sans-serif" font-size="13" font-weight="500" fill="#791F1F">密钥（无外键）</text>
<rect x="56" y="606" width="270" height="60" rx="8" fill="#F7C1C1" stroke="#A32D2D" stroke-width="0.5"/>
<text x="191" y="630" font-family="sans-serif" font-size="13" font-weight="500" fill="#501313" text-anchor="middle" dominant-baseline="central">oidc_jwk</text>
<text x="191" y="648" font-family="sans-serif" font-size="12" fill="#791F1F" text-anchor="middle" dominant-baseline="central">签名私钥，只暴露 n/e</text>

<text x="40" y="704" font-family="sans-serif" font-size="12" fill="#5F5E5A">外键：user_id → auth_user；client_id → oauth2_client；其余凭唯一约束 + 索引关联</text>
</svg>
